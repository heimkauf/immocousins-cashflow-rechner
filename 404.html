<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Seite nicht gefunden | immo.cousins</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230F5C55'/><text x='16' y='23' text-anchor='middle' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='%23E8B84B'>&#8364;</text></svg>">
<style>
:root{
  --petrol-900:#0F5C55; --petrol-700:#12776D; --mint-300:#8FDCD2; --mint-050:#EDFAF8;
  --gold-500:#E8B84B; --gold-300:#F3D48F; --auf-gold:#0C4B45;
  --grau-900:#3A3A3A; --grau-600:#666666; --weiss:#FFFFFF;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  font-family:"Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size:16px; line-height:1.55; color:var(--grau-900); background:var(--weiss);
}
.karte{
  max-width:34rem; width:100%; text-align:center;
  background:var(--mint-050); border:1px solid var(--mint-300);
  border-radius:16px; padding:36px 24px;
}
h1{color:var(--petrol-900); font-size:1.5rem; margin:0 0 10px; letter-spacing:-.01em}
p{color:var(--grau-600); margin:0 0 22px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:12px 22px; border-radius:999px;
  background:var(--gold-500); color:var(--auf-gold);
  font-weight:650; text-decoration:none;
  transition:background .15s ease;
}
.btn:hover{background:var(--gold-300)}
.btn:focus-visible{outline:2px solid var(--petrol-700); outline-offset:2px}
footer{margin-top:22px; font-size:.75rem; color:var(--grau-600)}
footer a{color:var(--grau-600); margin:0 6px; display:inline-block; padding:8px 0}
</style>
</head>
<body>
  <main class="karte">
    <h1>Diese Seite gibt es nicht</h1>
    <p>Der Link führt ins Leere – vielleicht ein Tippfehler oder eine alte Adresse.</p>
    <a class="btn" href="/">Zum Cashflow-Rechner →</a>
    <footer>
      <a href="https://heimkauf.de/impressum/" target="_blank" rel="noopener">Impressum</a> ·
      <a href="https://heimkauf.de/privacy-policy/" target="_blank" rel="noopener">Datenschutz</a>
    </footer>
  </main>
</body>
</html>
